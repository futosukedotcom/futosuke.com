<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="北の大地で働く横乗り好き、ふとすけの個人サイト。好きなもの、気になるもの、日々のこと。">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="https://futosuke.com/">
  <link rel="icon" type="image/png" sizes="192x192" href="./favicon.png">
  <link rel="apple-touch-icon" href="./favicon.png">
  <title>futosuke.com</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #222b2b;
      --muted: #62696e;
      --accent: #2859ad;
      --line: #e6e9ec;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", Meiryo, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--ink); min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
    a { color: var(--accent); text-underline-offset: 4px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; border-radius: 2px; }
    .wrap { width: min(100% - 48px, 640px); margin-inline: auto; }
    .hero { padding: 66px 0 45px; text-align: center; }
    .logo { display: block; width: 100px; height: 100px; margin: 0 auto 15px; object-fit: contain; }
    h1 { font-size: clamp(2.5rem, 9vw, 3.7rem); line-height: 1.15; font-weight: 700; letter-spacing: -.065em; margin: 0; }
    .tagline { font-size: .95rem; color: var(--muted); letter-spacing: .035em; margin: 13px 0 0; }
    .blog { display: inline-flex; align-items: center; justify-content: center; gap: 15px; min-height: 44px; border: 1px solid var(--line); border-radius: 7px; padding: 10px 23px; margin-top: 25px; text-decoration: none; font-size: .9rem; font-weight: 600; }
    .blog:hover { border-color: var(--accent); background: #f7faff; }
    .arrow { width: 15px; height: 15px; }
    .about { border-top: 1px solid var(--line); padding: 31px 0 30px; }
    .section-title { margin: 0 0 17px; font-size: .76rem; font-weight: 650; letter-spacing: .14em; color: var(--accent); }
    .name { font-size: 1.25rem; line-height: 1.6; font-weight: 650; margin: 0 0 11px; }
    .bio { margin: 0; font-size: .94rem; line-height: 2; }
    .bio + .bio { margin-top: 9px; }
    .interests { display: flex; flex-wrap: wrap; gap: 7px 15px; list-style: none; margin: 19px 0 0; padding: 0; font-size: .8rem; color: var(--muted); }
    .links { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 26px; border-top: 1px solid var(--line); padding: 24px 0 31px; }
    .links .section-title { margin: 0; }
    .links a { font-size: .88rem; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    footer { margin-top: auto; text-align: center; color: var(--muted); font-size: .75rem; padding: 19px 24px 24px; }
    @media (max-width: 480px) { .wrap { width: calc(100% - 44px); } .hero { padding: 45px 0 36px; } .logo { width: 88px; height: 88px; } .about { padding: 25px 0; } .bio { font-size: .9rem; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <img class="logo" src="./favicon.png" width="192" height="192" alt="">
      <h1>futosuke.com</h1>
      <p class="tagline">As usual We enjoyed</p>
      <a class="blog" href="https://blog.futosuke.com/">Blog <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
    </header>
    <section class="about" id="about" aria-labelledby="about-title">
      <h2 class="section-title" id="about-title">ABOUT</h2>
      <p class="name">ふとすけ</p>
      <p class="bio">北の大地で働く横乗り好き。<br>理想の生活を考えながら、ゆっくりと気ままに、好きなものや気になるものを綴っています。</p>
      <p class="bio">1989年6月生まれ。ITエンジニア。<br>好きなものを好きなときに。たまに仕事の話も。</p>
      <ul class="interests" aria-label="好きなもの">
        <li>Snowboard</li><li>SK8</li><li>Movie</li><li>Photo</li><li>Music</li><li>Fes</li><li>Fashion</li>
      </ul>
    </section>
    <nav class="links" aria-label="SNS">
      <span class="section-title">SOCIAL</span>
      <a href="https://x.com/_futosuke">X / Twitter</a>
      <a href="https://www.instagram.com/futosuke/">Instagram</a>
    </nav>
  </main>
  <footer>© futosuke.com</footer>
</body>
</html>
